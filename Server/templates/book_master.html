<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Master</title>
    <link rel= "stylesheet" href= "BookMaster.css">
    <style>
        body {
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .book-master-container {
            max-width: 1000px;
            margin: 40px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 40px;
            text-align: center;
            color: #007bff;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            color: #495057;
            margin-bottom: 25px;
            font-weight: 600;
            text-align: left;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        /* Responsive Table */
        .table-container {
            width: 100%;
            overflow-x: auto; /* Enables horizontal scrolling */
        }

        table {
            width: 100%;
            min-width: 800px; /* Prevents excessive shrinking */
            border-collapse: collapse;
            background-color: #fafafa;
            font-size: 18px;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.05rem;
            text-transform: uppercase;
            font-size: 16px;
        }

        tr:hover td {
            background-color: #f1f3f5;
            transition: background-color 0.3s ease;
        }

        /* Button Styling */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            background-color: #007bff;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .back-link:hover {
            background-color: #0056b3;
            color: #fff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .book-master-container {
                width: 95%;
                padding: 20px;
            }

            h1 {
                font-size: 32px;
            }

            h2 {
                font-size: 22px;
            }

            th, td {
                padding: 10px;
            }

            table {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="book-master-container">
        <h1>Book Master</h1>
        <h2>Book Roster</h2>
        
        <!-- Table Wrapper -->
        <div class="table-container">
            <table class="book-master-table">
                <thead>
                    <tr class="book-master-tr">
                        <th class= "book-master-th">Title</th>
                        <th class= "book-master-th">Author</th>
                        <th class= "book-master-th">Total Copies</th>
                        <th class= "book-master-th">Available Copies</th>
                    </tr>
                </thead>
                <tbody>
                    {% for book in books %}
                    <tr class="book-master-tr">
                        <td class= "book-master-td">{{ book.title }}</td>
                        <td class= "book-master-td">{{ book.author }}</td>
                        <td class= "book-master-td">{{ book.total_copies }}</td>
                        <td class= "book-master-td">{{ book.available_copies }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Back to Library Button -->
        <a href="{{ url_for('library') }}" class="back-link">Back to Library</a>
    </div>
</body>
</html>
